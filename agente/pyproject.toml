[project]
name = "agente"
version = "1.0.0"
description = "Agente da Central de Salas: host MCP por dentro, servidor A2A por fora"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["cliente_mcp", "demo_mcp", "tarefas", "ponte", "servidor_a2a"]
