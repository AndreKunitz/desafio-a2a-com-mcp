[project]
name = "servidor-mcp"
version = "1.0.0"
description = "Servidor MCP da Central de Salas (Hill Valley Tech)"
requires-python = ">=3.10"
dependencies = [
    "mcp==2.3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["servidor", "regras"]
